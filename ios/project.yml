# Inbox Only — XcodeGen project definition
#
# On a Mac:
#   brew install xcodegen
#   cd InboxOnly/ios && xcodegen generate && open InboxOnly.xcodeproj
#
# Two targets: the app (a full-screen inbox) and the Safari Web Extension it
# carries. Both use ../extension/inbox-only.user.js, so there is one source of
# truth for what gets blocked.

name: InboxOnly
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # Bundle IDs must be unique across Apple. If Xcode says the ID is taken,
    # change this (scripts/publish.sh also accepts BUNDLE_ID_PREFIX=...).
    BUNDLE_ID_PREFIX: com.nirlotan
    DEVELOPMENT_TEAM: "" # or pick your team in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  InboxOnly:
    type: application
    platform: iOS
    scheme: {} # shared scheme, so `xcodebuild archive -scheme InboxOnly` works
    sources:
      - path: App
      - path: ../extension/inbox-only.user.js
        buildPhase: resources
    dependencies:
      - target: InboxOnlyExtension # embedded in the app's PlugIns folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).InboxOnly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO # only standard HTTPS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to send in a chat.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a voice message.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Pick a photo to send in a chat.

  InboxOnlyExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      # manifest.json, the script and icons land flat in the .appex, which is
      # where Safari looks for manifest.json.
      - path: ../extension
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).InboxOnly.Extension
        PRODUCT_NAME: InboxOnlyExtension
        INFOPLIST_FILE: Extension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
