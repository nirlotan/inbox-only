# Builds an unsigned InboxOnly.ipa on GitHub's Macs, for people without one.
# Sideloadly / AltStore sign it with your own Apple ID when installing.
name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/InboxOnly.xcodeproj -target InboxOnly \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/InboxOnly.app Payload/
          test -f Payload/InboxOnly.app/PlugIns/InboxOnlyExtension.appex/manifest.json
          zip -qry InboxOnly.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: InboxOnly-ipa
          path: InboxOnly.ipa
